# Alembic configuration for PRESALES HUB
# Run from: apps/hub-api/
# Production: set DATABASE_URL env var — env.py reads it and overrides sqlalchemy.url

[alembic]
script_location = alembic
prepend_sys_path = .

# Migration file naming: YYYYMMDD_HHMM_<slug>.py  e.g. 20260522_1400_add_rfp_priority.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Default dev database (overridden by DATABASE_URL env var in env.py)
sqlalchemy.url = sqlite:///./presales_hub.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
