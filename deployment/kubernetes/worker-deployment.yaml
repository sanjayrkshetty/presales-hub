apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-worker
  namespace: presales-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-worker
  template:
    metadata:
      labels:
        app: temporal-worker
    spec:
      containers:
        - name: temporal-worker
          image: ghcr.io/YOUR_ORG/presales-hub-worker:latest
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: presales-hub-config
            - secretRef:
                name: presales-hub-secrets
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 250m
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 30
            periodSeconds: 30
