apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-api
  namespace: presales-hub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hub-api
  template:
    metadata:
      labels:
        app: hub-api
    spec:
      containers:
        - name: hub-api
          image: ghcr.io/YOUR_ORG/presales-hub-api:latest
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: presales-hub-config
            - secretRef:
                name: presales-hub-secrets
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: hub-api
  namespace: presales-hub
spec:
  selector:
    app: hub-api
  ports:
    - port: 8003
      targetPort: 8003
