name: presales-hub-prod

networks:
  hub-net:
    driver: bridge

volumes:
  pg-data:
  redis-data:
  temporal-db-data:

services:

  postgres:
    image: postgres:16-alpine
    restart: always
    networks: [hub-net]
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout:  3s
      retries:  10

  redis:
    image: redis:7-alpine
    restart: always
    networks: [hub-net]
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test:     ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout:  3s
      retries:  5

  temporal-db:
    image: postgres:16-alpine
    restart: always
    networks: [hub-net]
    environment:
      POSTGRES_USER:     ${TEMPORAL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD}
      POSTGRES_DB:       ${TEMPORAL_POSTGRES_DB}
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${TEMPORAL_POSTGRES_USER}"]
      interval: 5s
      timeout:  3s
      retries:  10

  temporal:
    image: temporalio/auto-setup:1.24
    restart: always
    networks: [hub-net]
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB:                   postgresql
      DB_PORT:              5432
      POSTGRES_USER:        ${TEMPORAL_POSTGRES_USER}
      POSTGRES_PWD:         ${TEMPORAL_POSTGRES_PASSWORD}
      POSTGRES_SEEDS:       temporal-db
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ../../config/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test:     ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout:  5s
      retries:  10
      start_period: 30s

  hub-api:
    image: ${REGISTRY}/presales-hub-api:${IMAGE_TAG:-latest}
    restart: always
    networks: [hub-net]
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL:    redis://:${REDIS_PASSWORD}@redis:6379
      TEMPORAL_HOST: temporal:7233
      ENVIRONMENT:  production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512m
    healthcheck:
      test:     ["CMD-SHELL", "curl -f http://localhost:8003/api/health || exit 1"]
      interval: 10s
      timeout:  5s
      retries:  10
      start_period: 20s

  temporal-worker:
    image: ${REGISTRY}/presales-hub-worker:${IMAGE_TAG:-latest}
    restart: always
    networks: [hub-net]
    env_file: .env.production
    environment:
      DATABASE_URL:       postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL:          redis://:${REDIS_PASSWORD}@redis:6379
      TEMPORAL_HOST:      temporal:7233
      ENVIRONMENT:        production
      WORKER_HEALTH_PORT: "8004"
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test:     ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health')\" || exit 1"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 20s

  hub-dashboard:
    image: ${REGISTRY}/presales-hub-dashboard:${IMAGE_TAG:-latest}
    restart: always
    networks: [hub-net]
    environment:
      NEXT_PUBLIC_HUB_API_URL: ${PUBLIC_API_URL}
    depends_on:
      hub-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m

  nginx:
    build:
      context: ../nginx
    restart: always
    networks: [hub-net]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - hub-api
      - hub-dashboard
