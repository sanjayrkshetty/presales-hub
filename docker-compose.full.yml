name: presales-hub

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  hub-net:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  pg-data:
  redis-data:
  temporal-db-data:

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [hub-net]
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-presales}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-presales_dev}
      POSTGRES_DB:       ${POSTGRES_DB:-presales_hub}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-presales} -d ${POSTGRES_DB:-presales_hub}"]
      interval: 5s
      timeout:  3s
      retries:  10

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [hub-net]
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  3s
      retries:  5

  # ── Temporal backing DB ──────────────────────────────────────────────────────
  temporal-db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [hub-net]
    environment:
      POSTGRES_USER:     ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      POSTGRES_DB:       ${TEMPORAL_POSTGRES_DB:-temporal}
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${TEMPORAL_POSTGRES_USER:-temporal}"]
      interval: 5s
      timeout:  3s
      retries:  10

  # ── Temporal server ──────────────────────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.24
    restart: unless-stopped
    networks: [hub-net]
    ports:
      - "7233:7233"
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB:                   postgres12
      DB_PORT:              5432
      POSTGRES_USER:        ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PWD:         ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      POSTGRES_SEEDS:       temporal-db
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./config/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test:     ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout:  5s
      retries:  10
      start_period: 30s

  # ── Temporal UI  →  http://localhost:8080 ────────────────────────────────────
  temporal-ui:
    image: temporalio/ui:2.26.2
    restart: unless-stopped
    networks: [hub-net]
    ports:
      - "8080:8080"
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS:      temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8080

  # ── Jaeger (tracing)  →  http://localhost:16686 ──────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    restart: unless-stopped
    networks: [hub-net]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP

  # ── Hub API ──────────────────────────────────────────────────────────────────
  hub-api:
    build:
      context: ./apps/hub-api
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [hub-net]
    ports:
      - "8003:8003"
    env_file:
      - .env.full.example
    environment:
      DATABASE_URL:    postgresql://${POSTGRES_USER:-presales}:${POSTGRES_PASSWORD:-presales_dev}@postgres:5432/${POSTGRES_DB:-presales_hub}
      REDIS_URL:       redis://redis:6379
      TEMPORAL_HOST:   temporal:7233
      OTLP_ENDPOINT:   http://jaeger:4318
      ENVIRONMENT:     development
      ALLOWED_ORIGINS: '["http://localhost:3002","http://hub-dashboard:3002"]'
      GROQ_API_KEY:          ${GROQ_API_KEY:-}
      LANGFUSE_PUBLIC_KEY:  ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY:  ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL:    ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_HOST:        ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      EMBEDDING_PROVIDER:   ${EMBEDDING_PROVIDER:-minilm}
      LLM_PROVIDER:         ${LLM_PROVIDER:-groq}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:     ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/api/health')\" || exit 1"]
      interval: 10s
      timeout:  5s
      retries:  10
      start_period: 20s

  # ── Temporal Worker ──────────────────────────────────────────────────────────
  temporal-worker:
    build:
      context: ./apps/hub-api
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    networks: [hub-net]
    ports:
      - "8004:8004"
    env_file:
      - .env.full.example
    environment:
      DATABASE_URL:      postgresql://${POSTGRES_USER:-presales}:${POSTGRES_PASSWORD:-presales_dev}@postgres:5432/${POSTGRES_DB:-presales_hub}
      REDIS_URL:         redis://redis:6379
      TEMPORAL_HOST:     temporal:7233
      OTLP_ENDPOINT:     http://jaeger:4318
      ENVIRONMENT:       development
      WORKER_HEALTH_PORT: "8004"
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:     ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health')\" || exit 1"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 20s

  # ── Seed (runs once, then exits) ─────────────────────────────────────────────
  hub-seed:
    build:
      context: ./apps/hub-api
      dockerfile: Dockerfile
    networks: [hub-net]
    command: python -m seed.enterprise
    env_file:
      - .env.full.example
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-presales}:${POSTGRES_PASSWORD:-presales_dev}@postgres:5432/${POSTGRES_DB:-presales_hub}
    depends_on:
      hub-api:
        condition: service_healthy
    restart: "no"

  # ── Hub Dashboard (frontend) ─────────────────────────────────────────────────
  hub-dashboard:
    build:
      context: ./apps/hub-dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_HUB_API_URL: http://localhost:8003
    restart: unless-stopped
    networks: [hub-net]
    ports:
      - "3002:3002"
    depends_on:
      hub-api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_HUB_API_URL: http://localhost:8003

  # ── pgAdmin (optional — comment out if not needed) ───────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    networks: [hub-net]
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@presaleshub.local
      PGADMIN_DEFAULT_PASSWORD: admin
    profiles: ["admin"]   # only starts with: docker compose --profile admin up
