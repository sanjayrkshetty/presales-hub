name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  api:
    name: Backend — lint + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: presales
          POSTGRES_PASSWORD: presales_dev
          POSTGRES_DB: presales_hub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/hub-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/hub-api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          DATABASE_URL: postgresql://presales:presales_dev@localhost:5432/presales_hub_test
          REDIS_URL: redis://localhost:6379
          TEMPORAL_HOST: localhost:7233
          SECRET_KEY: ci-test-secret-key-not-for-prod
          ENVIRONMENT: development
          EMBEDDING_PROVIDER: hash
          LLM_PROVIDER: mock
        run: python -m pytest tests/ -x -q --tb=short
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/hub-api/.pytest_cache

  dashboard:
    name: Frontend — typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hub-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/hub-dashboard/package-lock.json
      - run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test -- --run
      - name: Build check
        env:
          NEXT_PUBLIC_HUB_API_URL: http://localhost:8003
        run: npm run build
